[project]
name = "whoopmon"
version = "0.1.0"
description = "Collect WHOOP API v2 data and ship it to OpenObserve."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "typer>=0.12",
  "cryptography>=43",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[project.scripts]
whoopmon = "whoopmon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoopmon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
# E501: the formatter owns line length; long SQL strings stay readable.
# B008: typer declares options in argument defaults by design.
ignore = ["S101", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
# Dashboard and alert SQL is built from constants, not user input.
"src/whoopmon/provision/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running OpenObserve (run with -m integration)"]
addopts = "-m 'not integration'"
pythonpath = ["src"]
